name: clickmonk

# The image is built from this checkout; nothing is pulled from a registry.
# `clickmonk:local` is a local tag, deliberately not a registry-looking name,
# so nobody mistakes it for a published image.
x-app: &app
  image: clickmonk:local
  build: .
  # PID 1 must forward SIGTERM, or `docker compose stop` kills the redirect
  # without the drain that seals its spool segment.
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  redirect:
    <<: *app
    command: ["node", "packages/redirect/dist/index.js"]
    # Started after Postgres, but not gated on its health: the redirect must
    # be able to start and serve its last snapshot while Postgres is down.
    depends_on: [postgres]
    environment:
      CLICKMONK_POSTGRES_URL: postgres://clickmonk:${POSTGRES_PASSWORD:?set it in .env}@postgres:5432/clickmonk
      CLICKMONK_SECRET: ${CLICKMONK_SECRET:?set it in .env}
      CLICKMONK_TRUSTED_PROXIES: ${CLICKMONK_TRUSTED_PROXIES:-uniquelocal,loopback}
      # The one name besides a verified link domain that `ask` approves a
      # certificate for. Empty: no admin host, and no certificate for one.
      CLICKMONK_ADMIN_HOST: ${CLICKMONK_ADMIN_HOST:-}
    volumes:
      - spool:/var/lib/clickmonk/spool
      - state:/var/lib/clickmonk/state
      # Written by the worker; the redirect only reads it.
      - ipdata:/var/lib/clickmonk/ipdata:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # The admin API. Published nowhere: Caddy reaches it on the stack's own
  # network, and only for the host name CLICKMONK_ADMIN_HOST names. Unset, it
  # starts and answers 503 on every route rather than refusing to boot — an
  # install that never sets it must still serve its links.
  #
  # Started after ClickHouse but not gated on its health, the way the redirect
  # depends on Postgres: the reports read it, and a report answers 503 while it
  # is down rather than keeping the rest of this API from starting.
  admin:
    <<: *app
    command: ["node", "packages/admin/dist/index.js"]
    depends_on: [postgres, clickhouse]
    environment:
      CLICKMONK_POSTGRES_URL: postgres://clickmonk:${POSTGRES_PASSWORD:?set it in .env}@postgres:5432/clickmonk
      # Reports read ClickHouse directly. The same four values the worker has;
      # this service only ever reads.
      CLICKMONK_CLICKHOUSE_URL: http://clickhouse:8123
      CLICKMONK_CLICKHOUSE_USER: clickmonk
      CLICKMONK_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set it in .env}
      CLICKMONK_CLICKHOUSE_DB: clickmonk
      CLICKMONK_ADMIN_HOST: ${CLICKMONK_ADMIN_HOST:-}
      CLICKMONK_TRUSTED_PROXIES: ${CLICKMONK_TRUSTED_PROXIES:-uniquelocal,loopback}
      CLICKMONK_DNS_SERVERS: ${CLICKMONK_DNS_SERVERS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on: [redirect, admin]
    environment:
      # Read by the Caddyfile's @admin expression. Empty is expected and safe:
      # an expression matcher evaluates `host("")`, which matches nothing, so
      # an install that never named a host serves exactly what it did before.
      # A `host` matcher would instead refuse the empty value at boot, which is
      # why that matcher is an expression.
      CLICKMONK_ADMIN_HOST: ${CLICKMONK_ADMIN_HOST:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/tls.d:/etc/caddy/tls.d:ro
      - ./caddy/proxy.d:/etc/caddy/proxy.d:ro
      # Certificates and the ACME account live here. Back this volume up.
      - caddy-data:/data
      - caddy-config:/config
    # Not "is the process alive": a Caddyfile error under `restart:
    # unless-stopped` is a crash-loop that `up --wait` would otherwise report
    # as healthy, and a Caddy that starts and proxies nothing would pass any
    # probe that only asked for a response. Asking the reverse-proxy module
    # for its upstreams answers only once the site block is provisioned, names
    # the upstream, and does not fail while a certificate is still being
    # obtained — which is allowed to lag without failing an install.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/reverse_proxy/upstreams | grep -q 'redirect:8080'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    command: ["node", "packages/worker/dist/index.js"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      CLICKMONK_POSTGRES_URL: postgres://clickmonk:${POSTGRES_PASSWORD}@postgres:5432/clickmonk
      CLICKMONK_CLICKHOUSE_URL: http://clickhouse:8123
      CLICKMONK_CLICKHOUSE_USER: clickmonk
      CLICKMONK_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set it in .env}
      CLICKMONK_CLICKHOUSE_DB: clickmonk
      CLICKMONK_IPDATA_UPDATE: ${CLICKMONK_IPDATA_UPDATE:-on}
      CLICKMONK_DNS_CHECK: ${CLICKMONK_DNS_CHECK:-on}
      CLICKMONK_DNS_SERVERS: ${CLICKMONK_DNS_SERVERS:-}
      # An hour by default. The periods themselves are settings on the install,
      # not here: `clickmonk settings set --keep-clicks 30`.
      CLICKMONK_RETENTION_INTERVAL_MS: ${CLICKMONK_RETENTION_INTERVAL_MS:-3600000}
      # The worker itself never reads this. The CLI runs in this container, and
      # `domain add` refuses a link domain equal to the admin host name: a
      # domain under that name would take its requests to the admin API and
      # never redirect.
      CLICKMONK_ADMIN_HOST: ${CLICKMONK_ADMIN_HOST:-}
    volumes:
      - spool:/var/lib/clickmonk/spool
      - ipdata:/var/lib/clickmonk/ipdata

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clickmonk
      POSTGRES_USER: clickmonk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickmonk -d clickmonk -h \"$$(hostname)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: clickmonk
      CLICKHOUSE_USER: clickmonk
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://$$(hostname):8123/ping\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  caddy-data:
  caddy-config:
  spool:
  state:
  ipdata:
  postgres-data:
  clickhouse-data:

networks:
  default:
    # Without this, Docker relays IPv6 connections to a published port through
    # its own userland proxy and they arrive from the bridge gateway, so every
    # IPv6 visitor shares one address. Change the range only if it collides
    # with a network this host already has.
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${CLICKMONK_IPV6_SUBNET:-fd00:c11c:0::/64}
